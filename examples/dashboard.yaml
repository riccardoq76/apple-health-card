# Example dashboard for Apple Health Card.
# Paste into: Settings > Dashboards > (your dashboard) > Edit > three dots > Raw configuration editor.
# Replace "iphone" with your own Companion app sensor prefix (sensor.<prefix>_heart_rate ...).
#
# The "Andamento" view needs apexcharts-card (HACS).
# The sleep, heart, exercise and weight charts use raw history (apexcharts-card), NOT daily
# statistics: Health data only reaches Home Assistant when the iPhone syncs, so daily
# statistics would repeat the previous night on days without a sync and mix two
# nights on the day a new value arrives. Raw history is limited by the recorder
# retention (purge_keep_days, 10 days by default; 60 is a good value for this dashboard).
# Sleep uses the last value of the day; resting HR and HRV use the daily average.
# Chart titles are separate "heading" cards so they look the same for apexcharts and native graphs.
# Weight is a point chart on raw values (a weekly mean is misleading if you weigh yourself once a week).
views:
- title: Oggi
  path: oggi
  icon: mdi:heart-pulse
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:apple-health-card
      title: Salute
      prefix: iphone
      grid_options:
        columns: full
- icon: mdi:chart-line
  max_columns: 2
  path: andamento
  sections:
  - cards:
    - heading: Sonno
      icon: mdi:bed
      type: heading
    - heading: Sonno totale per notte (min)
      heading_style: subtitle
      type: heading
    - type: custom:apexcharts-card
      graph_span: 14d
      span:
        end: day
      grid_options:
        columns: full
      header:
        show: false
      apex_config:
        chart:
          height: 240
        legend:
          show: false
        tooltip:
          y:
            formatter: 'EVAL:function(v){ return (v === null || v === undefined) ? ''—'' : Math.round(v * 10) / 10 + '' min''; }'
      series:
      - entity: sensor.iphone_sleep_duration
        name: Sonno
        type: column
        color: '#5E5CE6'
        extend_to: false
        group_by:
          func: last
          duration: 1d
          fill: 'null'
    - heading: Fasi del sonno (min)
      heading_style: subtitle
      type: heading
    - type: custom:apexcharts-card
      graph_span: 14d
      span:
        end: day
      grid_options:
        columns: full
      header:
        show: false
      stacked: true
      apex_config:
        chart:
          height: 260
        legend:
          show: true
        tooltip:
          y:
            formatter: 'EVAL:function(v){ return (v === null || v === undefined) ? ''—'' : Math.round(v * 10) / 10 + '' min''; }'
      series:
      - entity: sensor.iphone_deep_sleep
        name: Profondo
        type: column
        color: '#5E5CE6'
        extend_to: false
        group_by:
          func: last
          duration: 1d
          fill: 'null'
      - entity: sensor.iphone_core_sleep
        name: Core
        type: column
        color: '#0A84FF'
        extend_to: false
        group_by:
          func: last
          duration: 1d
          fill: 'null'
      - entity: sensor.iphone_rem_sleep
        name: REM
        type: column
        color: '#64D2FF'
        extend_to: false
        group_by:
          func: last
          duration: 1d
          fill: 'null'
      - entity: sensor.iphone_awake
        name: Sveglio
        type: column
        color: '#FF9F0A'
        extend_to: false
        group_by:
          func: last
          duration: 1d
          fill: 'null'
    type: grid
  - cards:
    - heading: Cuore
      icon: mdi:heart
      type: heading
    - heading: FC a riposo (bpm)
      heading_style: subtitle
      type: heading
    - type: custom:apexcharts-card
      graph_span: 14d
      span:
        end: day
      grid_options:
        columns: full
      header:
        show: false
      apex_config:
        chart:
          height: 220
        legend:
          show: false
        stroke:
          curve: straight
          width: 2
        markers:
          size: 5
        tooltip:
          y:
            formatter: 'EVAL:function(v){ return (v === null || v === undefined) ? ''—'' : Math.round(v * 10) / 10 + '' bpm''; }'
      series:
      - entity: sensor.iphone_resting_heart_rate
        name: FC a riposo
        type: line
        color: '#FF453A'
        extend_to: false
        group_by:
          func: avg
          duration: 1d
          fill: 'null'
    - heading: Variabilità HRV (ms)
      heading_style: subtitle
      type: heading
    - type: custom:apexcharts-card
      graph_span: 14d
      span:
        end: day
      grid_options:
        columns: full
      header:
        show: false
      apex_config:
        chart:
          height: 220
        legend:
          show: false
        stroke:
          curve: straight
          width: 2
        markers:
          size: 5
        tooltip:
          y:
            formatter: 'EVAL:function(v){ return (v === null || v === undefined) ? ''—'' : Math.round(v * 10) / 10 + '' ms''; }'
      series:
      - entity: sensor.iphone_heart_rate_variability
        name: HRV
        type: line
        color: '#BF5AF2'
        extend_to: false
        group_by:
          func: avg
          duration: 1d
          fill: 'null'
    type: grid
  - cards:
    - heading: Attività
      icon: mdi:walk
      type: heading
    - heading: Passi al giorno
      heading_style: subtitle
      type: heading
    - chart_type: bar
      days_to_show: 30
      entities:
      - color: '#FF9F0A'
        entity: sensor.iphone_health_steps
        name: Passi
      grid_options:
        columns: full
      period: day
      stat_types:
      - change
      type: statistics-graph
    - heading: Energia attiva al giorno (kcal)
      heading_style: subtitle
      type: heading
    - chart_type: bar
      days_to_show: 30
      entities:
      - color: '#FA114F'
        entity: sensor.iphone_active_energy
        name: Energia attiva
      grid_options:
        columns: full
      period: day
      stat_types:
      - change
      type: statistics-graph
    - heading: Minuti di esercizio al giorno
      heading_style: subtitle
      type: heading
    - type: custom:apexcharts-card
      graph_span: 14d
      span:
        end: day
      grid_options:
        columns: full
      header:
        show: false
      apex_config:
        chart:
          height: 220
        legend:
          show: false
        tooltip:
          y:
            formatter: 'EVAL:function(v){ return (v === null || v === undefined) ? ''—'' : Math.round(v) + '' min''; }'
          enabledOnSeries:
          - 0
        stroke:
          dashArray:
          - 0
          - 5
      series:
      - entity: sensor.iphone_exercise_time
        name: Esercizio
        type: column
        color: '#92E82A'
        extend_to: false
        group_by:
          func: max
          duration: 1d
          fill: 'null'
      - entity: sensor.iphone_exercise_time
        name: Obiettivo 30 min
        type: line
        color: '#8E8E93'
        stroke_width: 2
        show:
          legend_value: false
        data_generator: 'return [[start.getTime(), 30], [end.getTime(), 30]];'
    type: grid
  - cards:
    - heading: Corpo
      icon: mdi:scale-bathroom
      type: heading
    - heading: Peso (kg)
      heading_style: subtitle
      type: heading
    - type: custom:apexcharts-card
      graph_span: 30d
      grid_options:
        columns: full
      header:
        show: false
      apex_config:
        chart:
          height: 220
        legend:
          show: false
        stroke:
          curve: straight
          width: 2
        markers:
          size: 5
        yaxis:
          min: 62
          max: 72
          decimalsInFloat: 0
        tooltip:
          y:
            formatter: 'EVAL:function(v){ return (v === null || v === undefined) ? ''—'' : v + '' kg''; }'
      series:
      - entity: sensor.iphone_weight
        name: Peso
        type: line
        color: '#AF8E6B'
        extend_to: false
    - heading: VO2 max
      heading_style: subtitle
      type: heading
    - chart_type: line
      days_to_show: 90
      entities:
      - color: '#30D158'
        entity: sensor.iphone_vo2_max
        name: VO2 max
      grid_options:
        columns: full
      period: week
      stat_types:
      - mean
      type: statistics-graph
    type: grid
  title: Andamento
  type: sections
